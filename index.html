<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融投研 Copilot · 工作台</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-2: #1a2332;
    --muted: #64748b;
    --line: #e6e9ef;
    --bg: #f4f6f9;
    --card: #ffffff;
    --side: #fbfcfe;
    --accent: #1a2332;
    --a: #1d4ed8; --a-bg: #e8efff;
    --b: #b45309; --b-bg: #fdf1e0;
    --c: #b91c1c; --c-bg: #fdeaea;
    --d: #047857; --d-bg: #e6f6ef;
    --warn-bg: #fff8e6; --warn-line: #f0c674;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    -webkit-font-smoothing: antialiased;
  }

  /* ══ 左侧工作台 ══ */
  .sidebar {
    width: 264px; flex-shrink: 0; background: var(--card);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100vh;
  }
  .side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .brand h1 { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .brand .sub { font-size: 10.5px; color: #94a3b8; }
  .new-task-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 12px; background: var(--ink-2); color: #fff; border: none;
    border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .15s;
  }
  .new-task-btn:hover { background: #24344b; }
  .new-task-btn .plus { font-size: 16px; line-height: 1; margin-top: -1px; }

  .side-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 18px; }
  .side-section { margin-bottom: 16px; }
  .side-title {
    font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: .6px;
    font-weight: 700; padding: 2px 6px 8px; display: flex; align-items: center; gap: 6px;
  }
  .side-title .count { color: #b6c0cc; font-weight: 400; letter-spacing: 0; }

  /* 工具组 */
  .tool-group { margin-bottom: 10px; }
  .tool-group .grp-head {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-size: 12px; color: #475569; font-weight: 600; padding: 4px 6px; border-radius: 6px;
  }
  .tool-group .grp-head:hover { background: #f1f4f8; }
  .tool-group .grp-head .count { color: #94a3b8; font-weight: 400; }
  .tool-group .grp-head .caret { color: #94a3b8; font-size: 9px; transition: transform .15s; }
  .tool-group.collapsed .caret { transform: rotate(-90deg); }
  .tool-group.collapsed ul { display: none; }
  .tool-list { font-size: 11.5px; color: #475569; line-height: 1.6; margin-top: 2px; }
  .tool-list li { list-style: none; padding: 2px 6px 2px 18px; position: relative; word-break: break-all; border-radius: 5px; }
  .tool-list li:hover { background: #f4f6f9; }
  .tool-list li::before { content: ""; position: absolute; left: 7px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: #cbd5e1; }
  .tool-list li.mcp::before { background: #93a5bb; }
  .side-hint { font-size: 10.5px; color: #a0aec0; line-height: 1.55; padding: 8px 6px 0; border-top: 1px dashed var(--line); margin-top: 8px; }

  /* 任务列表 */
  .task-group-head {
    font-size: 10.5px; color: #aab4c2; font-weight: 700; letter-spacing: .5px;
    padding: 10px 6px 4px;
  }
  .task-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 9px;
    border-radius: 8px; cursor: pointer; transition: background .12s; position: relative;
  }
  .task-item:hover { background: #f1f4f8; }
  .task-item.active { background: #e8efff; }
  .task-item .t-dot { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
  .task-item.active .t-dot { background: var(--a); }
  .task-item .t-main { min-width: 0; flex: 1; }
  .task-item .t-title {
    font-size: 13px; color: #334155; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.35;
  }
  .task-item.active .t-title { color: var(--ink); font-weight: 600; }
  .task-item .t-time { font-size: 10.5px; color: #a3adbb; margin-top: 1px; }
  .task-item .t-pin { font-size: 11px; color: #d1a23a; flex-shrink: 0; }
  .task-item .t-actions {
    display: none; gap: 2px; flex-shrink: 0;
  }
  .task-item:hover .t-actions { display: flex; }
  .task-item .t-actions button {
    border: none; background: transparent; cursor: pointer; font-size: 12px;
    color: #94a3b8; padding: 2px 4px; border-radius: 5px; line-height: 1;
  }
  .task-item .t-actions button:hover { background: #e2e8f0; color: #475569; }
  .task-empty { font-size: 11.5px; color: #a0aec0; padding: 6px 8px; line-height: 1.6; }

  /* ══ 右侧聊天 ══ */
  .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  .chat-head {
    height: 54px; flex-shrink: 0; border-bottom: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; gap: 12px; padding: 0 22px;
  }
  .chat-head .ch-title {
    font-size: 15px; font-weight: 650; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%;
    border: 1px solid transparent; border-radius: 7px; padding: 3px 6px; outline: none;
  }
  .chat-head .ch-title:focus { border-color: #dbe0e8; background: #fbfcfe; }
  .chat-head .ch-meta { font-size: 11.5px; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
  .chat-head .ch-meta .sid {
    font-family: ui-monospace, Consolas, monospace; background: #f1f4f8;
    padding: 1px 6px; border-radius: 5px; color: #7c8798;
  }
  .chat-head .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.18); }
  .status-dot.off { background: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.18); }

  .messages { flex: 1; overflow-y: auto; padding: 26px 28px; scroll-behavior: smooth; }

  /* 消息 */
  .msg { display: flex; gap: 12px; margin-bottom: 22px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .msg.ai .avatar { background: linear-gradient(135deg, #2b3a52, #16202f); }
  .msg.user .avatar { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .body { max-width: min(860px, 82%); min-width: 0; }
  .msg.user .body { display: flex; flex-direction: column; align-items: flex-end; }
  .msg-bubble {
    padding: 12px 16px; border-radius: 13px; font-size: 14px; line-height: 1.72;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.user .msg-bubble { background: var(--ink-2); color: #fff; border-top-right-radius: 4px; }
  .msg.ai .msg-bubble { background: var(--card); border: 1px solid var(--line); border-top-left-radius: 4px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .msg.ai .msg-bubble.reject { background: var(--warn-bg); border-color: var(--warn-line); }
  .msg-bubble .content > :first-child { margin-top: 0; }
  .msg-bubble .content > :last-child { margin-bottom: 0; }

  .thinking { font-size: 11.5px; color: #94a3b8; margin: 0 0 6px 2px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .thinking .step { padding: 1px 8px; background: #eef1f5; border-radius: 20px; }
  .thinking .arrow { color: #cbd5e1; }

  .meta { margin: 7px 2px 0; font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .channel-badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 600; }
  .channel-A { background: var(--a-bg); color: var(--a); }
  .channel-B { background: var(--b-bg); color: var(--b); }
  .channel-C { background: var(--c-bg); color: var(--c); }
  .channel-D { background: var(--d-bg); color: var(--d); }
  .meta .pill { background: #eef1f5; color: #64748b; border-radius: 20px; padding: 2px 9px; }
  .meta .copy {
    margin-left: auto; cursor: pointer; border: 1px solid var(--line); background: #fff;
    border-radius: 6px; padding: 2px 9px; color: #64748b; font-size: 11px;
  }
  .meta .copy:hover { background: #f8fafc; color: var(--ink); }

  .interrupt-box { background: #fff8e1; border: 1px solid var(--warn-line); border-radius: 10px; padding: 12px 16px; margin: 0 28px 16px; }
  .interrupt-box .label { font-size: 13px; color: #b45309; margin-bottom: 8px; font-weight: 600; }
  .interrupt-box .input-row { display: flex; gap: 8px; }
  .interrupt-box input { flex: 1; padding: 9px 12px; border: 1px solid #e2c98a; border-radius: 7px; font-size: 14px; outline: none; background: #fff; }
  .interrupt-box input:focus { border-color: #d19a1e; }
  .interrupt-box button { padding: 9px 18px; border: none; border-radius: 7px; background: #b45309; color: #fff; cursor: pointer; font-size: 13px; }

  .input-area { border-top: 1px solid var(--line); background: var(--card); padding: 14px 28px 16px; flex-shrink: 0; }
  .input-row { display: flex; gap: 12px; max-width: 1000px; margin: 0 auto; align-items: flex-end; }
  .input-row textarea {
    flex: 1; padding: 11px 15px; border: 1.5px solid #dbe0e8; border-radius: 11px;
    font-size: 14px; line-height: 1.5; outline: none; resize: none; max-height: 160px;
    font-family: inherit; transition: border-color .15s; background: #fbfcfe;
  }
  .input-row textarea:focus { border-color: var(--ink-2); background: #fff; }
  .input-row button {
    padding: 11px 26px; background: var(--ink-2); color: #fff; border: none; border-radius: 11px;
    font-size: 14px; cursor: pointer; font-weight: 600; transition: .15s; height: 44px;
  }
  .input-row button:hover:not(:disabled) { background: #24344b; }
  .input-row button:disabled { background: #c8cfd9; cursor: not-allowed; }
  .input-tip { max-width: 1000px; margin: 6px auto 0; font-size: 11px; color: #a0aec0; }

  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 { margin: 13px 0 7px; font-weight: 650; line-height: 1.4; }
  .msg-bubble h1 { font-size: 19px; } .msg-bubble h2 { font-size: 16.5px; } .msg-bubble h3 { font-size: 15px; } .msg-bubble h4 { font-size: 14px; }
  .msg-bubble p { margin: 7px 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 7px 0; padding-left: 22px; }
  .msg-bubble li { margin: 3px 0; }
  .msg-bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; display: block; overflow-x: auto; }
  .msg-bubble th, .msg-bubble td { border: 1px solid #e2e6ee; padding: 6px 11px; text-align: left; white-space: nowrap; }
  .msg-bubble th { background: #f5f7fa; font-weight: 600; }
  .msg-bubble code { background: #f1f3f7; padding: 2px 6px; border-radius: 4px; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msg-bubble pre { background: #0f172a; color: #e2e8f0; padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
  .msg-bubble pre code { background: none; color: inherit; padding: 0; }
  .msg-bubble blockquote { border-left: 3px solid #cbd5e1; padding-left: 12px; color: #64748b; margin: 8px 0; }
  .msg-bubble hr { border: none; border-top: 1px solid #e6e9ef; margin: 12px 0; }
  .msg-bubble a { color: #1d4ed8; }

  .streaming .content::after { content: "▊"; margin-left: 1px; animation: blink 1s steps(1) infinite; color: #94a3b8; }
  @keyframes blink { 50% { opacity: 0; } }

  .empty-state { text-align: center; color: #94a3b8; margin-top: 8vh; }
  .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
  .empty-state .lead { font-size: 15px; color: #64748b; margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 640px; margin: 0 auto; }
  .chip { font-size: 12.5px; padding: 7px 13px; border: 1px solid var(--line); background: #fff; border-radius: 20px; cursor: pointer; color: #475569; transition: .15s; }
  .chip:hover { border-color: #b7c2d0; color: var(--ink); box-shadow: 0 2px 6px rgba(15,23,42,.06); }

  .messages::-webkit-scrollbar, .side-scroll::-webkit-scrollbar { width: 9px; }
  .messages::-webkit-scrollbar-thumb, .side-scroll::-webkit-scrollbar-thumb { background: #d5dbe4; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  .messages::-webkit-scrollbar-thumb:hover, .side-scroll::-webkit-scrollbar-thumb:hover { background: #b9c2ce; background-clip: padding-box; }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .body { max-width: 88%; }
    .messages { padding: 18px 14px; }
  }
</style>
</head>
<body>

<!-- ══ 左侧工作台 ══ -->
<aside class="sidebar">
  <div class="side-head">
    <div class="brand">
      <h1>金融投研 Copilot</h1>
      <span class="sub">A 股工作台</span>
    </div>
    <button class="new-task-btn" id="newTaskBtn"><span class="plus">＋</span> 新建任务</button>
  </div>

  <div class="side-scroll">
    <div class="side-section">
      <div class="side-title">工具 <span class="count" id="toolCount"></span></div>
      <div id="toolGroups"><div class="side-hint">加载中…</div></div>
    </div>

    <div class="side-section">
      <div class="side-title">任务 <span class="count" id="taskCount"></span></div>
      <div id="taskList"><div class="task-empty">还没有任务，点上方「新建任务」开始。</div></div>
    </div>
  </div>
</aside>

<!-- ══ 右侧聊天 ══ -->
<div class="chat-area">
  <div class="chat-head">
    <div class="ch-title" id="taskTitle" contenteditable="true" spellcheck="false" title="点一下可重命名">未选择任务</div>
    <div class="ch-meta" id="chatMeta"></div>
    <div class="right">
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中…</span>
      </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div id="interruptContainer"></div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="inputBox" rows="1" placeholder="输入你的问题…（Enter 发送 / Shift+Enter 换行）" autocomplete="off"></textarea>
      <button id="sendBtn">发送</button>
    </div>
    <div class="input-tip">本系统只答 A 股投研相关问题；不提供买卖建议、不预测涨跌。回答中的数字均来自工具并可溯源。每个任务的对话记忆相互独立。</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// 全局状态
// ══════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const STORE_KEY = 'copilot_workspace_v1';

const 空状态HTML = `
  <div class="empty-state" id="emptyState">
    <div class="icon">📊</div>
    <div class="lead">问我任何关于 A 股上市公司的问题</div>
    <div class="chips" id="chips">
      <span class="chip">宝钢股份 2025 年的营业收入是多少？</span>
      <span class="chip">宝钢股份的 ROE 是多少？</span>
      <span class="chip">钢铁行业 2025 年营业总收入合计？</span>
      <span class="chip">今天有多少涨停股票？</span>
      <span class="chip">现在 LPR 是多少？</span>
      <span class="chip">市盈率是什么意思？</span>
      <span class="chip">你有哪些能力？</span>
    </div>
  </div>`;

let state = { tasks: [], activeId: null };
let isStreaming = false;

// ══════════════════════════════════════════════════════════════
// 任务持久化（localStorage）
//   每个任务 = { id, title, sessionId, createdAt, updatedAt, pinned, messages:[] }
//   message = { role:'user'|'ai', text, meta?, reject? }
// ══════════════════════════════════════════════════════════════
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) { state = { tasks: [], activeId: null }; }
  if (!state.tasks) state.tasks = [];
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function activeTask() { return state.tasks.find(t => t.id === state.activeId) || null; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function newTask() {
  const t = { id: uid(), title: '新任务', sessionId: '', createdAt: Date.now(), updatedAt: Date.now(), pinned: false, messages: [] };
  state.tasks.unshift(t);
  state.activeId = t.id;
  saveState();
  renderTaskList(); renderChat();
  $('inputBox').focus();
  return t;
}
function switchTask(id) {
  if (state.activeId === id) return;
  state.activeId = id;
  saveState();
  renderTaskList(); renderChat();
}
function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (t.messages.length && !confirm(`删除任务「${t.title}」？该任务的对话记录将被清除。`)) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  if (state.activeId === id) state.activeId = state.tasks[0] ? state.tasks[0].id : null;
  saveState(); renderTaskList(); renderChat();
}
function togglePin(id) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  t.pinned = !t.pinned; saveState(); renderTaskList();
}
function renameTask(id, title) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  t.title = (title || '').trim() || '新任务'; t.updatedAt = Date.now();
  saveState(); renderTaskList(); renderChatHeader();
}

// ══════════════════════════════════════════════════════════════
// 任务列表渲染（置顶 / 今天 / 更早）
// ══════════════════════════════════════════════════════════════
function isToday(ts) {
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function fmtTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (isToday(ts)) return new Date(ts).toTimeString().slice(0, 5);
  if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}
function taskRow(t) {
  const act = t.id === state.activeId ? ' active' : '';
  const pin = t.pinned ? '<span class="t-pin" title="已置顶">★</span>' : '';
  return `
    <div class="task-item${act}" data-id="${t.id}">
      <span class="t-dot"></span>
      <div class="t-main">
        <div class="t-title">${esc(t.title)}</div>
        <div class="t-time">${fmtTime(t.updatedAt)}${t.messages.length ? ' · ' + Math.floor(t.messages.length / 2 + .5) + ' 问' : ''}</div>
      </div>
      ${pin}
      <div class="t-actions">
        <button data-act="pin" title="${t.pinned ? '取消置顶' : '置顶'}">${t.pinned ? '☆' : '★'}</button>
        <button data-act="del" title="删除">🗑</button>
      </div>
    </div>`;
}
function renderTaskList() {
  const box = $('taskList');
  $('taskCount').textContent = state.tasks.length ? `(${state.tasks.length})` : '';
  if (!state.tasks.length) {
    box.innerHTML = '<div class="task-empty">还没有任务，点上方「新建任务」开始。</div>';
    return;
  }
  const sorted = [...state.tasks].sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
  const pinned = sorted.filter(t => t.pinned);
  const today = sorted.filter(t => !t.pinned && isToday(t.updatedAt));
  const older = sorted.filter(t => !t.pinned && !isToday(t.updatedAt));
  let html = '';
  if (pinned.length) html += `<div class="task-group-head">置顶任务 (${pinned.length})</div>` + pinned.map(taskRow).join('');
  if (today.length) html += `<div class="task-group-head">今天</div>` + today.map(taskRow).join('');
  if (older.length) html += `<div class="task-group-head">更早</div>` + older.map(taskRow).join('');
  box.innerHTML = html;

  box.querySelectorAll('.task-item').forEach(el => {
    el.addEventListener('click', (e) => {
      const act = e.target.closest('button');
      if (act) {
        e.stopPropagation();
        if (act.dataset.act === 'pin') togglePin(el.dataset.id);
        if (act.dataset.act === 'del') deleteTask(el.dataset.id);
        return;
      }
      switchTask(el.dataset.id);
    });
  });
}

// ══════════════════════════════════════════════════════════════
// 聊天区渲染
// ══════════════════════════════════════════════════════════════
function renderChatHeader() {
  const t = activeTask();
  const title = $('taskTitle');
  if (!t) { title.textContent = '未选择任务'; $('chatMeta').innerHTML = ''; return; }
  title.textContent = t.title;
  $('chatMeta').innerHTML = t.sessionId ? `<span class="sid">会话 ${t.sessionId.slice(0, 8)}</span>` : '';
}
function renderChat() {
  const t = activeTask();
  renderChatHeader();
  const box = $('messages');
  box.innerHTML = '';
  if (!t || !t.messages.length) {
    box.innerHTML = 空状态HTML;
    bindChips();
    return;
  }
  for (const m of t.messages) {
    const ctx = makeMsg(m.role, '', t);
    if (m.role === 'ai') {
      ctx.content.innerHTML = renderMarkdown(m.text);
      if (m.reject) ctx.bubble.classList.add('reject');
      if (m.meta) applyMeta(ctx, m.meta);
    } else {
      ctx.content.textContent = m.text;
    }
  }
  scrollBottom();
}

// ══════════════════════════════════════════════════════════════
// 健康检查 + 工具清单
// ══════════════════════════════════════════════════════════════
function isMcp(name) { return /^[\x00-\x7F]+$/.test(name); }
async function checkHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    if (!data.ok) throw new Error('not ok');
    $('statusDot').classList.remove('off');
    $('statusText').textContent = `已连接 · ${data.tools.length} 工具`;
    $('toolCount').textContent = `(${data.tools.length})`;
    const local = data.tools.filter(t => !isMcp(t));
    const mcp = data.tools.filter(t => isMcp(t));
    const group = (title, arr, cls) => arr.length ? `
      <div class="tool-group">
        <div class="grp-head"><span class="caret">▾</span>${title} <span class="count">${arr.length}</span></div>
        <ul class="tool-list">${arr.map(t => `<li class="${cls}">${t}</li>`).join('')}</ul>
      </div>` : '';
    $('toolGroups').innerHTML = group('本地工具', local, '') + group('MCP 外部工具', mcp, 'mcp');
    document.querySelectorAll('.tool-group .grp-head').forEach(h =>
      h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed')));
  } catch (e) {
    $('statusDot').classList.add('off');
    $('statusText').textContent = '连接失败';
    $('toolGroups').innerHTML = '<div class="side-hint">无法读取工具清单</div>';
  }
}

// ══════════════════════════════════════════════════════════════
// Markdown 渲染
// ══════════════════════════════════════════════════════════════
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(md) {
  const lines = (md || '').replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      let html = '<table>', first = true;
      for (const r of rows) {
        if (/^[\s|:\-]+$/.test(r)) continue;
        const cells = r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
        const tag = first ? 'th' : 'td';
        html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
        first = false;
      }
      out.push(html + '</table>'); continue;
    }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + inline(buf.join(' ')) + '</blockquote>'); continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^(#{1,4}\s|\s*```|\s*\||\s*>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + buf.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}

// ══════════════════════════════════════════════════════════════
// 消息 DOM
// ══════════════════════════════════════════════════════════════
function scrollBottom() { const m = $('messages'); m.scrollTop = m.scrollHeight; }

function makeMsg(role, text, task) {
  const box = $('messages');
  if (box.querySelector('#emptyState')) box.innerHTML = '';
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'ai' ? '研' : '我';
  const body = document.createElement('div');
  body.className = 'body';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  const content = document.createElement('div');
  content.className = 'content';
  if (role === 'ai' && text) content.innerHTML = renderMarkdown(text);
  else content.textContent = text || '';
  bubble.appendChild(content);
  body.appendChild(bubble);
  if (role === 'ai') msg.appendChild(avatar);
  msg.appendChild(body);
  if (role === 'user') msg.appendChild(avatar);
  box.appendChild(msg);
  scrollBottom();
  return { msg, body, bubble, content };
}

function addThinkingStep(ctx, node, index) {
  let t = ctx.msg.querySelector('.thinking');
  if (!t) { t = document.createElement('div'); t.className = 'thinking'; ctx.body.insertBefore(t, ctx.bubble); }
  if (t.children.length) { const a = document.createElement('span'); a.className = 'arrow'; a.textContent = '›'; t.appendChild(a); }
  const s = document.createElement('span'); s.className = 'step'; s.textContent = `${index}. ${node}`;
  t.appendChild(s);
}

function badgeLabel(通道, 子类) {
  if (通道 === 'A') return ['结构化查询', 'A'];
  if (通道 === 'B') return ['受约束泛问', 'B'];
  if (通道 === 'C') return [子类 === '域外' ? '域外拒答' : '越界拒答', 'C'];
  if (通道 === 'D') {
    if (子类 === '自述') return ['系统自述', 'D'];
    if (子类 === '会话') return ['会话回顾', 'D'];
    return ['通用知识', 'D'];
  }
  return null;
}
function applyMeta(ctx, evt) {
  const meta = document.createElement('div');
  meta.className = 'meta';
  const parts = [];
  const bl = badgeLabel(evt.通道, evt.子类);
  if (bl) parts.push(`<span class="channel-badge channel-${bl[1]}">${bl[0]}</span>`);
  if (evt.elapsed_ms) parts.push(`<span class="pill">耗时 ${(evt.elapsed_ms / 1000).toFixed(1)}s</span>`);
  if (typeof evt.无支撑断言率 === 'number' && !evt.guard)
    parts.push(`<span class="pill">无支撑断言率 ${(evt.无支撑断言率 * 100).toFixed(0)}%</span>`);
  if (evt.工具 && evt.工具.length) parts.push(`<span class="pill">工具: ${evt.工具.join(' · ')}</span>`);
  if (evt.guard) parts.push(`<span class="pill">护栏: ${evt.guard}</span>`);
  meta.innerHTML = parts.join('');
  const copy = document.createElement('span');
  copy.className = 'copy';
  copy.textContent = '复制';
  copy.addEventListener('click', () => {
    navigator.clipboard.writeText(ctx.content.innerText).then(() => {
      copy.textContent = '已复制'; setTimeout(() => copy.textContent = '复制', 1200);
    }).catch(() => {});
  });
  meta.appendChild(copy);
  ctx.body.appendChild(meta);
}

// ══════════════════════════════════════════════════════════════
// interrupt（人工确认）
// ══════════════════════════════════════════════════════════════
function showInterrupt(question) {
  const box = document.createElement('div');
  box.className = 'interrupt-box';
  box.id = 'interruptBox';
  box.innerHTML = `
    <div class="label">⚠️ 需要你的确认：${esc(question)}</div>
    <div class="input-row">
      <input type="text" id="interruptInput" placeholder="输入你的答复…">
      <button id="interruptBtn">提交</button>
    </div>`;
  $('interruptContainer').appendChild(box);
  $('interruptBtn').addEventListener('click', submitInterrupt);
  $('interruptInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitInterrupt(); });
  $('interruptInput').focus();
}
async function submitInterrupt() {
  const answer = $('interruptInput').value.trim();
  if (!answer) return;
  const t = activeTask(); if (!t) return;
  $('interruptBox').remove();
  setStreaming(true);
  try {
    const res = await fetch('/chat/resume', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: t.sessionId, answer })
    });
    const data = await res.json();
    const text = data.status === 'ok' ? data.answer : `❌ ${data.error || '出错了'}`;
    const ctx = makeMsg('ai', '', t);
    ctx.content.innerHTML = renderMarkdown(text);
    t.messages.push({ role: 'ai', text });
    t.updatedAt = Date.now(); saveState(); renderTaskList();
  } catch (e) {
    makeMsg('ai', `❌ 网络错误：${e.message}`, t);
  }
  setStreaming(false);
}

// ══════════════════════════════════════════════════════════════
// 发送（SSE 流式）
// ══════════════════════════════════════════════════════════════
async function sendQuestion(question) {
  question = (question || '').trim();
  if (!question || isStreaming) return;
  let t = activeTask();
  if (!t) t = newTask();

  // 首问时把默认标题改成问题摘要
  if (t.title === '新任务') t.title = question.slice(0, 24);
  t.messages.push({ role: 'user', text: question });
  t.updatedAt = Date.now();
  saveState();

  makeMsg('user', question, t);
  renderChatHeader(); renderTaskList();
  setStreaming(true);

  const ctx = makeMsg('ai', '', t);
  ctx.bubble.classList.add('streaming');
  let currentText = '';
  let gotToken = false;
  let interrupted = false;
  let doneEvt = null;

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: t.sessionId || undefined })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) {
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          let evt; try { evt = JSON.parse(line.slice(6)); } catch { continue; }
          switch (evt.type) {
            case 'start':
              if (evt.session_id && evt.session_id !== t.sessionId) {
                t.sessionId = evt.session_id; saveState(); renderChatHeader();
              }
              break;
            case 'node':
              addThinkingStep(ctx, evt.node, evt.index || 0);
              break;
            case 'token':
              gotToken = true;
              currentText += (evt.text || '');
              ctx.content.innerHTML = renderMarkdown(currentText);
              scrollBottom();
              break;
            case 'interrupt':
              interrupted = true;
              showInterrupt(evt.question);
              break;
            case 'done':
              doneEvt = evt;
              // 【本地修复】以服务端**最终答案**为准（done.answer 才是走过 复核/溯源 的正文）。
              // 流式 token 只是过程展示：一旦两边的正文不一致（例如过程里混进了分诊 JSON、
              // 或答案被硬护栏改写），就直接对齐，别把中间产物留在气泡里。
              if (evt.answer && evt.answer.trim() && evt.answer !== currentText) {
                currentText = evt.answer;
                ctx.content.innerHTML = renderMarkdown(currentText);
                scrollBottom();
              }
              break;
            case 'error':
              ctx.content.innerHTML = `<span style="color:#b91c1c;">❌ ${esc(evt.error || '未知错误')}</span>`;
              break;
          }
        }
      }
    }
  } catch (e) {
    ctx.content.innerHTML = `<span style="color:#b91c1c;">❌ 网络错误：${esc(e.message)}</span>`;
  }

  ctx.bubble.classList.remove('streaming');

  if (!gotToken && doneEvt && doneEvt.answer) {
    currentText = doneEvt.answer;
    ctx.content.innerHTML = renderMarkdown(doneEvt.answer);
  }
  if (interrupted && !ctx.content.textContent.trim()) {
    ctx.content.innerHTML = '<span style="color:#94a3b8;">（等待你的确认…）</span>';
  }
  const shown = ctx.content.innerText || '';
  const reject = shown.includes('【无法回答】') || shown.includes('【护栏拦截】');
  if (reject) ctx.bubble.classList.add('reject');
  if (doneEvt) applyMeta(ctx, doneEvt);

  // 存进本任务（记忆）
  t.messages.push({ role: 'ai', text: currentText || shown, meta: doneEvt || undefined, reject });
  t.updatedAt = Date.now();
  saveState(); renderTaskList();

  scrollBottom();
  setStreaming(false);
}

// ══════════════════════════════════════════════════════════════
// 工具 & 事件
// ══════════════════════════════════════════════════════════════
function setStreaming(loading) {
  isStreaming = loading;
  $('sendBtn').disabled = loading;
  $('sendBtn').textContent = loading ? '生成中…' : '发送';
}
function submit() {
  const q = $('inputBox').value.trim();
  if (!q) return;
  $('inputBox').value = '';
  autoGrow();
  sendQuestion(q);
}
function autoGrow() {
  const t = $('inputBox');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 160) + 'px';
}
function bindChips() {
  document.querySelectorAll('.chips .chip').forEach(c =>
    c.addEventListener('click', () => { $('inputBox').value = c.textContent; autoGrow(); submit(); }));
}

$('newTaskBtn').addEventListener('click', () => newTask());
$('sendBtn').addEventListener('click', submit);
$('inputBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
$('inputBox').addEventListener('input', autoGrow);

// 任务标题重命名
const titleEl = $('taskTitle');
titleEl.addEventListener('blur', () => {
  const t = activeTask(); if (!t) return;
  renameTask(t.id, titleEl.textContent);
});
titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
});

// ══════════════════════════════════════════════════════════════
// 启动
// ══════════════════════════════════════════════════════════════
loadState();
if (state.activeId && !activeTask()) state.activeId = state.tasks[0] ? state.tasks[0].id : null;
renderTaskList();
renderChat();
checkHealth();
if (!state.tasks.length) newTask();
</script>
